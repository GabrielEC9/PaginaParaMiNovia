<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Perfil</title>

  <!-- CSS GLOBAL -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
</head>

<body class="ladybug-bg profile-page">

  <!-- FONDO DEL CIELO -->
  <div class="sky-background">
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>
    <div class="cloud cloud4"></div>
    <div class="cloud cloud5"></div>
    <div class="cloud cloud6"></div>
    <div class="cloud cloud7"></div>
    <div class="cloud cloud8"></div>
  </div>

<!-- MENÚ GLOBAL -->
<header class="main-menu">

  <div class="menu-left">
    <button id="menu-toggle" class="menu-toggle">☰</button>

    <span class="menu-title">
      Bienvenida mi amor
    </span>
  </div>

  <div class="anniversary-container">
  <span class="anniversary-label">
    Próximo aniversario:
  </span>

  <span id="anniversary-countdown">
    Calculando...
  </span>
</div>

</header>

<!-- SIDEBAR -->
<nav id="menu-links">

  <div class="menu-header">
    <span>Menú</span>

    <button id="close-menu" class="close-menu">
      ✕
    </button>
  </div>

  <!-- LINKS DINÁMICOS -->
  <div class="menu-items"></div>
  <div class="menu-footer">
    <button id="logout-btn" class="btn-logout">
      Cerrar sesión
    </button>
  </div>

</nav>

  <!-- CONTENIDO PERFIL -->
<div class="rewards-wrapper">

  <section class="rewards-header">
    <h1 class="rewards-title">Mi Perfil</h1>
  </section>

  <main class="rewards-container profile-container">

    <section class="profile-card">

      <div class="avatar-wrap">
        <img id="avatar-img" class="avatar-img" width="200" height="200" alt="Foto de perfil" />
        <button id="avatar-edit-btn" class="avatar-edit-btn" title="Cambiar foto">📷</button>
        <input type="file" id="avatar-input" accept="image/*" hidden />
      </div>

      <h2 id="profile-username" class="profile-username">—</h2>

      <div class="profile-stats-grid">
        <div class="profile-stat">
          <span class="profile-stat-value" id="profile-bugs">0</span>
          <span class="profile-stat-label">Bugs 🐞</span>
        </div>
        <div class="profile-stat">
          <span class="profile-stat-value" id="profile-streak">0</span>
          <span class="profile-stat-label">Racha 🔥</span>
        </div>
        <div class="profile-stat">
          <span class="profile-stat-value" id="profile-boletos">0</span>
          <span class="profile-stat-label">Boletos 🎟️</span>
        </div>
      </div>

      <div id="profile-message" class="reward-message"></div>

    </section>

    <section class="profile-codes">
      <h2 class="box-title">Descuentos disponibles</h2>
      <div id="codes-available" class="codes-list"></div>

      <h2 class="box-title">Descuentos usados</h2>
      <div id="codes-used" class="codes-list"></div>
    </section>

  </main>

</div>

  <!-- JS -->
  <script type="module" src="/js/supabaseClient.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/ui.js"></script>
  <script type="module" src="/js/perfil.js"></script>
  <script type="module" src="/js/menu.js"></script>
  <script type="module" src="/js/sky.js"></script>

</body>
</html>
